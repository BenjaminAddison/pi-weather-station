# WeatherPi firewall (docs/pi-software.md "Network roles", D23).
# Installed as /etc/nftables.d/weatherpi.nft and pulled in by /etc/nftables.conf.
#
# Only our own table is (re)defined: no "flush ruleset", because Tailscale and
# NetworkManager's shared-mode NAT for usb0 add their own tables. A packet must be
# accepted by every table's input hook, so "drop" here is final.
#
# wlan0 has NO inbound services by design (D23): it is the internet uplink only.
# Setup happens over usb0, monitoring over tailscale0.

# Idempotent reload: create-if-missing, delete, redefine (one atomic transaction).
table inet weatherpi
delete table inet weatherpi

table inet weatherpi {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP / ICMPv6 (ping, PMTU, IPv6 neighbour discovery and RAs).
        meta l4proto { icmp, ipv6-icmp } accept

        # DHCP client replies (wlan0, or usb0 in rpi-usb-gadget "client" mode)
        # and DHCPv6; the broadcast/multicast exchange isn't conntrack-matched.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # Any interface: Tailscale direct (peer-to-peer) WireGuard, and mDNS.
        udp dport 41641 accept
        udp dport 5353 accept

        # iifname (not iif): usb0/tailscale0 may not exist yet when this loads.
        iifname "usb0" jump usb_in
        iifname "tailscale0" jump tailnet_in
    }

    # Setup link (10.12.194.1): SSH, agent, and NM shared-mode DHCP/DNS (dnsmasq)
    # for the USB host.
    chain usb_in {
        tcp dport { 22, 8765 } accept
        udp dport 67 accept
        udp dport 53 accept
        tcp dport 53 accept
    }

    # Monitoring link: SSH, agent, and tailscale serve (443, 80 redirects) -> dashboard.
    chain tailnet_in {
        tcp dport { 22, 80, 443, 8765 } accept
    }

    # NM shared mode (ICS) forwards between usb0 and the uplink; Tailscale adds its own.
    chain forward {
        type filter hook forward priority filter; policy accept;
    }
}
