#!/usr/sbin/nft -f
# WeatherPi: replaces Debian's default (written by pi/install.sh; original kept as .orig).
# Deliberately no "flush ruleset" (that would also wipe Tailscale's and
# NetworkManager's tables on a reload). Each file in /etc/nftables.d/ must
# manage only its own table; ours is weatherpi.nft (repo: pi/nftables.conf).
include "/etc/nftables.d/*.nft"
