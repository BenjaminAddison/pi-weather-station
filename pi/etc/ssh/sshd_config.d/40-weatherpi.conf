# WeatherPi SSH policy (D8): key login always; password login only after the claim.
#
# How the claim turns password login on: sshd keeps the FIRST value it reads for a
# keyword, and reads /etc/ssh/sshd_config.d/*.conf in lexical order (the Include
# sits at the top of sshd_config). At claim the agent writes
#     /etc/ssh/sshd_config.d/10-weatherpi-password.conf  ->  "PasswordAuthentication yes"
# which sorts before this file and therefore wins; deleting it turns passwords off
# again. install.sh owns (and overwrites) this file but never touches the 10- one.
# Keep this file's number above 10 and below 50 (cloud-init's 50-cloud-init.conf).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
